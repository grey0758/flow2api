services:
  flow2api-mvp:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.headed
    image: flow2api:mvp
    container_name: flow2api-mvp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp
      - ./config/setting.toml:/app/config/setting.toml
    environment:
      PYTHONUNBUFFERED: "1"
      ALLOW_DOCKER_HEADED_CAPTCHA: "true"
      DISPLAY: ":99"
      XVFB_SCREEN: "1440x900x24"
    shm_size: "2gb"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
