name: Flow2API MVP Stability

on:
  push:
    branches:
      - main
      - mvp-stable
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flow2api-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q main.py src tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: flow2api:mvp-standard
          load: true
          cache-from: type=gha,scope=mvp-standard
          cache-to: type=gha,mode=max,scope=mvp-standard

      - name: Smoke test standard image
        run: ./scripts/mvp_smoke.sh flow2api:mvp-standard

      - name: Build headed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.headed
          tags: flow2api:mvp-headed
          load: false
          cache-from: type=gha,scope=mvp-headed
          cache-to: type=gha,mode=max,scope=mvp-headed
